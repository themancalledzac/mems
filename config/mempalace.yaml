# Memory Palace taxonomy.
#
# Runtime knobs (env vars consumed by upstream mempalace):
#   MEMPALACE_PALACE_PATH       — palace directory (set by entrypoint.sh)
#   MEMPALACE_EMBEDDING_MODEL   — minilm | embeddinggemma (default: minilm)
#   MEMPALACE_HOOKS_AUTO_SAVE   — true | false (default: true)
#   MEMPALACE_EAGER_WARMUP      — 1 = warm the embedder at startup (default: off)
#   MEMPALACE_TOPIC_TUNNEL_MIN_COUNT — co-occurrence threshold for topic tunnels (default: 1, wrapper sets 2)
#   MEMPALACE_ENTITY_LANGUAGES  — comma list, e.g. "en,pt-br" (default: en)
#   MEMPALACE_MAX_CHUNKS_PER_FILE — safety cap (default: upstream's tuned value)
#   MEMPALACE_MAX_BACKUPS       — cap on repair/migrate backup dirs kept (default: 10, 0 = keep all)
#
# Shape: wings[<wing>].halls[<hall>].rooms is a list of {name, description, keywords}.
#   - Halls are broad feature areas ("landing-page", "media-pipeline").
#   - Rooms are sub-topics within a hall.
#   - Keywords are short tokens matched against file basenames, path segments,
#     and file content (routing handled by upstream mempalace.miner.detect_room).
#
# A file is routed to a room via priority-ordered detection:
#   1. rooms.json explicit blocks (per-wing override)
#   2. Path prefix — wing path segment substring-matches a room name or keyword
#   3. Keyword content score — highest-scoring room wins
#   4. Fallback — 'general' room (auto-created per wing)
#
# Room names must be unique within a wing.
#
# sync: controls which repo files each wing indexes. The base list is
#   `git ls-files --cached --others --exclude-standard`, filtered by upstream's
#   extension, filename, skip-dir and size rules.
#   - exclude: gitignore-style patterns dropped on top of that list.
#   - max_data_file_bytes: size cap for data_extensions files. null = no cap.
#   - data_extensions: suffixes the cap applies to.

sync:
  exclude: ["**/.claude/settings.local.json", "**/.claude/.cc-writes/**"]
  max_data_file_bytes: null
  data_extensions: [.json, .jsonl, .csv]

