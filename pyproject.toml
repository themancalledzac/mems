[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mems"
version = "0.1.0"
description = "Memory Palace multi-repo orchestrator — wraps mempalace with wingpacks, disaster recovery, and a unified CLI."
requires-python = ">=3.12,<3.15"
readme = "README.md"
dependencies = [
    # TEMP: 3.3.6 is not yet on PyPI — pin to the git tag so we capture #1540
    # (the silent long-drawer truncation fix). Revert to "mempalace>=3.3.6" once
    # it publishes. v3.3.6 == commit db1fbe8. Needs allow-direct-references below.
    "mempalace @ git+https://github.com/MemPalace/mempalace@v3.3.6",
    "mcp[cli]>=1.0.0",
    "uvicorn>=0.30.0",
    "starlette>=0.38.0",
    "sentence-transformers>=2.7.0",
    "pyyaml>=6.0,<7",
    "h2>=4.1.0",
    "chromadb>=1.5.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.4.0",
]

[project.scripts]
mems = "mems_cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src", "mems_cli"]

[tool.hatch.metadata]
# Required so the git-ref pin on mempalace (a PEP 508 direct reference) is
# accepted at build time. Remove once mempalace reverts to a plain PyPI pin.
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["B", "E", "F", "W", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
