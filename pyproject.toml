[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mems"
version = "0.1.0"
description = "Memory Palace multi-repo orchestrator — wraps mempalace with wingpacks, disaster recovery, and a unified CLI."
requires-python = ">=3.12,<3.15"
readme = "README.md"
dependencies = [
    # 3.4.x is on PyPI. 3.4.1 carries the HNSW index-integrity fixes
    # (#1710/#1573/#1579/#1747) that harden the wing-filtered-search path that
    # bit us on the 3.3.6 deploy, plus #1540 (silent long-drawer truncation).
    "mempalace>=3.4.1",
    "mcp[cli]>=1.0.0",
    "uvicorn>=0.30.0",
    "starlette>=0.38.0",
    "sentence-transformers>=2.7.0",
    "pyyaml>=6.0,<7",
    "h2>=4.1.0",
    "chromadb>=1.5.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.4.0",
]

[project.scripts]
mems = "mems_cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src", "mems_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["B", "E", "F", "W", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
